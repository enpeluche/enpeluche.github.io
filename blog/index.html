<!DOCTYPE html>

<html lang="fr">

<head>
    <!-- metadata -->

    <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Blog - Lucas Noirot (Petit)</title>

    <meta name="description"
        content="Le blog de Lucas Noirot (Petit) : articles sur les mathématiques, l'algorithmique, le ray tracing et la vie étudiante.">

    <meta name="keywords" content="">

    <meta name="author" content="Lucas Noirot (Petit)">

    <!-- Aperçu lors d'un partage (LinkedIn, messageries…) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Lucas Noirot (Petit)">
    <meta property="og:title" content="Blog - Lucas Noirot (Petit)">
    <meta property="og:description"
        content="Découvrez mes articles sur le développement, le ray tracing, les maths et la vie étudiante !">
    <meta property="og:url" content="https://enpeluche.github.io/blog/">
    <meta property="og:image" content="https://enpeluche.github.io/assets/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Lucas Noirot (Petit), doctorant en algorithmique à l'institut FEMTO-ST">
    <meta property="og:locale" content="fr_FR">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="/assets/img/logo/logo.ico" type="image/x-icon">

    <!-- for rendering latex -->

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">

    <!-- JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>



    <!-- ALL STYLESHEET -->

    <link rel="stylesheet" href="/assets/css/main.css">

    <!-- Header commun : à charger avant le <body> (voir le fichier) -->
    <script src="/components/SiteHeader/SiteHeader.js"></script>
</head>

<body>

    <div id="tsparticles"></div>

    <!-- Header commun, sans bouton de langue : le blog n'est qu'en français -->
    <site-header></site-header>



    <main>
        <div id="blog-view">
            <div class="blog-toolbar">
                <div class="search-wrapper">
                    <input type="text" id="blog-search" placeholder="Rechercher un article...">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2"
                            fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>

                <select id="blog-sort">
                    <option value="newest">Plus récents d'abord</option>
                    <option value="oldest">Plus anciens d'abord</option>
                </select>
            </div>

            <div id="no-results" class="hidden" style="text-align:center; padding: 2rem;">
                Aucun article ne correspond à ta recherche 😔
            </div>


            <section class="blog-grid fade-in-up delay-2" id="blog-container"></section>
            <!-- les articles sont chargés ici -->
        </div>

        <div id="article-view" class="hidden">
            <button id="back-btn" class="btn-back">
                ← Retour aux articles
            </button>

            <div id="article-content-loader" class="article-body"></div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script data-goatcounter="https://enpeluche.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
</body>

</html>
