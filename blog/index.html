<!DOCTYPE html>

<html lang="fr">

<head>
    <!-- metadata -->

    <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Blog - Lucas Noirot (Petit)</title>

    <meta name="description"
        content="Le blog de Lucas Noirot (Petit) : articles sur les mathématiques, l'algorithmique, le ray tracing et la vie étudiante.">

    <meta name="keywords" content="">

    <meta name="author" content="Lucas Noirot (Petit)">

    <!-- Aperçu lors d'un partage (LinkedIn, messageries…) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Lucas Noirot (Petit)">
    <meta property="og:title" content="Blog - Lucas Noirot (Petit)">
    <meta property="og:description"
        content="Découvrez mes articles sur le développement, le ray tracing, les maths et la vie étudiante !">
    <meta property="og:url" content="https://enpeluche.github.io/blog/">
    <link rel="canonical" href="https://enpeluche.github.io/blog/">
    <meta property="og:image" content="https://enpeluche.github.io/assets/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Lucas Noirot (Petit), doctorant en algorithmique à l'institut FEMTO-ST">
    <meta property="og:locale" content="fr_FR">

    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="/assets/img/logo/logo.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/img/logo/logo-192x192.png">
    <!-- Icône quand on ajoute le site à l'écran d'accueil d'un téléphone (fond blanc : iOS remplit la transparence en noir) -->
    <link rel="apple-touch-icon" href="/assets/img/logo/apple-touch-icon.png">

    <script>
        // Anciens liens partagés (/blog/?post=dossier) : redirection immédiate vers la page de l'article
        (function () {
            const post = new URLSearchParams(window.location.search).get("post");
            if (post) window.location.replace(`/blog/articles/${encodeURIComponent(post)}/`);
        })();
    </script>

    <!-- ALL STYLESHEET -->

    <link rel="stylesheet" href="/assets/css/main.css">

    <!-- Thème jour/nuit puis header commun : à charger avant le <body> (voir les fichiers) -->
    <script src="/assets/js/theme.js"></script>
    <script src="/components/SiteHeader/SiteHeader.js"></script>
</head>

<body>

    <div id="tsparticles"></div>

    <!-- Header commun, sans bouton de langue : le blog n'est qu'en français -->
    <site-header></site-header>



    <main>
        <!-- Titre de la page pour les lecteurs d'écran (l'onglet « Blog » du menu le montre déjà à l'écran) -->
        <h1 class="visually-hidden">Blog de Lucas Noirot (Petit)</h1>
        <div id="blog-view">
            <div class="blog-toolbar">
                <div class="search-wrapper">
                    <input type="text" id="blog-search" placeholder="Rechercher un article..."
                        aria-label="Rechercher un article">
                    <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2"
                            fill="none" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>

                <select id="blog-sort" aria-label="Ordre des articles">
                    <option value="newest">Plus récents d'abord</option>
                    <option value="oldest">Plus anciens d'abord</option>
                </select>
            </div>

            <div id="no-results" class="hidden" style="text-align:center; padding: 2rem;">
                Aucun article ne correspond à ta recherche 😔
            </div>


            <!-- Cartes générées par blog.js à partir de blog/data.json ; chaque carte mène à la page de l'article -->
            <section class="blog-grid" id="blog-container"></section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
    <script data-goatcounter="https://enpeluche.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
</body>

</html>
